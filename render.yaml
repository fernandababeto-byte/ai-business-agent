databases:
  - name: revenue-os-db
    plan: free
    databaseName: revenue_os
    user: revenue_os

envVarGroups:
  - name: revenue-os-shared
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 1440

services:
  - type: web
    name: revenue-os-api
    runtime: docker
    plan: free
    dockerCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - fromGroup: revenue-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: revenue-os-db
          property: connectionString
      - key: DASHBOARD_URL
        sync: false
      - key: BOOTSTRAP_TENANT_NAME
        value: Revenue OS Test Store
      - key: BOOTSTRAP_TENANT_SLUG
        value: revenue-os-test-store
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_API_VERSION
        value: 2026-04
      - key: SHOPIFY_SCOPES
        value: read_orders,read_products,read_inventory,read_locations,read_customers
      - key: SHOPIFY_AUTO_SYNC_ENABLED
        value: true
      - key: SHOPIFY_AUTO_SYNC_INTERVAL_SECONDS
        value: 900
      - key: SHOPIFY_AUTO_SYNC_INITIAL_DELAY_SECONDS
        value: 5
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

  - type: web
    name: revenue-os-dashboard
    runtime: docker
    plan: free
    dockerCommand: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    envVars:
      - fromGroup: revenue-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: revenue-os-db
          property: connectionString
      - key: API_BASE_URL
        sync: false

